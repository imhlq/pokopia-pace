id = "builder_boost"
name = "Pokopia Pace · 生活加速"
version = "1.6.4"
authors = ["Pokopia Pace contributors"]
description = "Movement, crafting, collection, gameplay waits, cooked-food power-ups and Magnet Rise settings."
license = "MIT"
loader = ">=0.7.0 <1.0.0"
game = ["2.0.1"]
affects = "gameplay"

[[settings]]
key = "sprint"
type = "number"
min = 1.0
max = 3.0
step = 0.1
default = 1.5
label = "Stick-click sprint speed multiplier"

[[settings]]
key = "run"
type = "number"
min = 1.0
max = 3.0
step = 0.1
default = 1.5
label = "Full-stick movement speed multiplier"

[[settings]]
key = "craft"
type = "number"
min = 1
max = 5
step = 1
default = 3
label = "Common materials and building blocks crafted multiplier"

[[settings]]
key = "collection"
type = "number"
min = 1
max = 5
step = 1
default = 3
label = "Gathered materials, ores and crops multiplier"

[[settings]]
key = "wait"
type = "number"
min = 0.1
max = 1.0
step = 0.1
default = 0.5
label = "Gameplay wait duration (0.5 = half, 1 = normal)"

[[settings]]
key = "food_buff"
type = "number"
min = 1.0
max = 5.0
step = 0.5
default = 2.0
label = "Cooked-food power-up duration multiplier"

[[settings]]
key = "magnet_rise"
type = "bool"
default = true
label = "Unlock Magnet Rise early"

[[settings]]
key = "magnet_rise_pp"
type = "number"
min = 0.1
max = 1.0
step = 0.1
default = 0.5
label = "Magnet Rise PP cost (0.5 = half, 1 = normal)"

